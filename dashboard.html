<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard del Sistema de Seguridad Escolar AulaVanguardia">
    <title>AulaVanguardia - Panel Principal</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/map.css">

    <style>
        :root {
            --sidebar-bg: #0f2027;
            --sidebar-gradient: linear-gradient(180deg, #0f2027, #203a43, #2c5364);
        }

        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            overflow-x: hidden;
        }

        #sidebar-wrapper {
            background: var(--sidebar-gradient);
            min-height: 100vh;
            width: 260px;
            transition: margin 0.3s ease-out;
        }
    </style>
</head>

<body>

    <div class="d-flex" id="wrapper">
        <aside class="text-white d-flex flex-column justify-content-between p-3 shadow-lg" id="sidebar-wrapper">
            <div>
                <div class="sidebar-heading text-white py-3 fs-5 fw-bold d-flex align-items-center gap-3 border-bottom border-light border-opacity-25 mb-3">
                    <div class="bg-white p-1 rounded-3 shadow-sm d-flex align-items-center justify-content-center">
                        <img src="assets/images/Aula-removebg-preview.png" alt="Logo AulaVanguardia" style="height: 32px;">
                    </div>
                    <div class="lh-1">
                        <span class="d-block mb-1">AulaVanguardia</span>
                        <small class="d-block text-white-50 fw-normal" style="font-size: 0.7rem;">Prevención y Seguridad</small>
                    </div>
                </div>

                <nav class="list-group list-group-flush my-2" id="sidebar-menu">
                    <a href="#" class="list-group-item list-group-item-action bg-transparent text-white rounded-3 mb-2 active">
                        <i class="bi bi-grid-1x2-fill me-3"></i> Dashboard
                    </a>
                    <a href="#seccion-mapa" class="list-group-item list-group-item-action bg-transparent text-white-50 rounded-3 mb-2">
                        <i class="bi bi-map-fill me-3"></i> Plano Interactivo
                    </a>
                </nav>
            </div>

            <div class="card bg-black bg-opacity-25 border-0 rounded-4 p-3 text-white mt-auto shadow-sm">
                <button class="btn btn-outline-light btn-sm w-100 fw-semibold" onclick="window.location.href='index.html'">
                    <i class="bi bi-box-arrow-left me-2"></i> Cerrar Sesión
                </button>
            </div>
        </aside>

        <div id="page-content-wrapper" class="w-100 d-flex flex-column">
            <header class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-3 py-3 sticky-top shadow-sm">
                <h1 class="h4 mb-0 fw-bold text-dark">AulaVanguardia - Dashboard Central</h1>
            </header>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
